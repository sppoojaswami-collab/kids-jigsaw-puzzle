<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff4d6"><title>Little Wonder Puzzles</title>
<style>
:root{--ink:#263451;--pink:#ff78a6;--blue:#73d5f4;--yellow:#ffdb69;--mint:#8ce6c4;--purple:#b9a3ff;--paper:#fffdf7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(150deg,#fff5d9,#ffe8f0 58%,#e5f7ff)}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:var(--ink);font-weight:900}.screen{position:fixed;inset:0;display:none;overflow:hidden}.screen.active{display:flex}.setup{flex-direction:column;align-items:center;padding:clamp(10px,2.5vh,24px);gap:clamp(8px,1.8vh,18px);overflow:auto;scrollbar-width:none}.setup::-webkit-scrollbar{display:none}.brand{font-size:clamp(22px,5vw,34px);font-weight:1000;letter-spacing:-1px;text-align:center}.brand span{color:#ff6394}.intro{text-align:center}.intro h1{font-size:clamp(20px,4vw,29px);margin:0 0 4px}.intro p{margin:0;color:#68748c;font-weight:700;font-size:clamp(12px,2.2vw,15px)}.section{width:min(100%,760px);text-align:center}.section-label{font-size:clamp(13px,2.5vw,17px);font-weight:1000;margin:0 0 8px}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.level{background:#fff;padding:clamp(8px,1.7vh,14px) 4px;border-radius:16px;box-shadow:0 4px 0 #d9d8e9;border:2px solid transparent;font-size:clamp(12px,2.5vw,16px)}.level small{display:block;font-size:11px;margin-top:3px;color:#67728b}.level.active{background:#fff0a9;border-color:#f2c747;box-shadow:0 3px 0 #e4b638}.pictures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.picture{padding:7px;background:#ffffffb8;border:3px solid white;border-radius:17px;box-shadow:0 4px 0 #ded5e9;min-width:0}.picture.active{border-color:#ff78a6;background:#fff5fa;box-shadow:0 3px 0 #e85c90}.picture img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;display:block}.picture span{display:block;font-size:clamp(11px,2.5vw,15px);font-weight:950;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{background:var(--mint);padding:12px 32px;border-radius:17px;box-shadow:0 5px 0 #51bf9c;font-size:clamp(16px,3vw,20px);min-width:min(80vw,300px)}.start:active,.control:active{transform:translateY(2px)}.note{font-size:11px;color:#78819a;font-weight:700;text-align:center;margin:0}
/* The play screen is deliberately locked to the viewport: no page scrolling. */
.game{flex-direction:column;padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom);gap:6px;align-items:stretch}.gamehead{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;gap:8px}.gtitle{font-size:clamp(14px,3.5vw,20px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{font-variant-numeric:tabular-nums;background:white;border-radius:12px;padding:7px 12px;font-size:clamp(17px,4vw,22px);font-weight:1000;box-shadow:0 3px 0 #e1d9e8;flex-shrink:0}.preview{position:absolute;top:54px;right:10px;width:44px;height:44px;border:3px solid white;border-radius:11px;box-shadow:0 3px 0 #ddd2e8;object-fit:cover;z-index:2}.board-wrap{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center}.board{height:min(100%,calc(100vw - 18px));width:min(100%,calc(100vw - 18px));max-height:100%;max-width:100%;aspect-ratio:1;display:grid;gap:2px;padding:3px;background:#d7def0;border:3px solid white;border-radius:17px;box-shadow:0 5px 0 #d8d0e6;touch-action:manipulation;overflow:hidden}.cell{min-width:0;min-height:0;position:relative;border:1px dashed #9daac9;background:#f5f6ff;border-radius:5px;overflow:hidden}.cell.filled{border:0;box-shadow:inset 0 0 0 1px #ffffff}.piece{width:100%;height:100%;min-width:0;min-height:0;background-repeat:no-repeat;user-select:none;-webkit-user-drag:none;touch-action:manipulation;cursor:pointer;border-radius:4px;box-shadow:0 2px 0 #c7c9e0;position:relative}.piece.selected{outline:3px solid var(--pink);outline-offset:-3px;filter:brightness(1.07)}.tray-area{flex:0 0 clamp(70px,15vh,112px);min-height:0;background:#ffffff91;border:2px solid white;border-radius:14px;padding:5px 7px;display:flex;flex-direction:column;gap:4px}.tray-label{font-size:11px;font-weight:950;display:flex;justify-content:space-between;align-items:center}.tray{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:4px;overflow:hidden}.tray .piece{min-width:0;min-height:0;max-height:100%;aspect-ratio:1;align-self:center;justify-self:center;width:100%;height:auto;max-width:calc((100vh - 180px)/8)}.tray .piece.placed{display:none}.tray .piece.selected{transform:scale(.94)}.bottom-controls{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:2px 0 3px}.control{min-width:0;padding:9px 2px;border-radius:12px;background:white;box-shadow:0 3px 0 #ddd5e9;font-size:clamp(10px,2.7vw,13px);white-space:nowrap}.control.pause{background:#dff6ff}.control.hint{background:#fff0a9}.control.magic{background:#e3d9ff}.control.home{background:#ffe1eb}.status{height:18px;flex:0 0 18px;text-align:center;font-size:12px;font-weight:900;color:#7058bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:#18213dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{width:min(92vw,480px);background:#fffaf0;border-radius:22px;padding:12px;text-align:center}.modalbox img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px}.modalbox button{background:var(--pink);color:white;padding:9px 18px;border-radius:12px;margin-top:8px}.magic-flash{position:fixed;inset:0;pointer-events:none;z-index:20;display:none;place-items:center;background:#ffffffb8}.magic-flash.show{display:grid;animation:flash .9s ease-out forwards}.wand{font-size:90px;filter:drop-shadow(0 0 18px #a68bfa);animation:wand .85s ease-in-out}@keyframes wand{0%{transform:rotate(-35deg) scale(.4)}50%{transform:rotate(20deg) scale(1.25)}100%{transform:rotate(0) scale(.6);opacity:0}}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}@media (orientation:landscape) and (max-height:500px){.game{gap:3px}.gamehead{height:32px;flex-basis:32px}.preview{top:40px;width:34px;height:34px}.tray-area{flex-basis:62px;padding:3px}.tray{grid-template-rows:1fr}.tray .piece{max-width:calc((100vw - 100px)/16)}.control{padding:5px 1px}.status{height:14px;flex-basis:14px}}
</style></head><body>
<section id="setup" class="screen setup active" aria-label="Choose your puzzle">
 <div class="brand">✨ Little <span>Wonder</span> Puzzles</div><div class="intro"><h1>Ready, little puzzle star? 🌟</h1><p>Choose a picture and puzzle level, then tap Start!</p></div>
 <div class="section"><h2 class="section-label">1. Choose your level</h2><div class="levels"><button class="level active" data-level="easy">🐣 Easy<small>2 × 2 · 4 pieces</small></button><button class="level" data-level="medium">🦊 Medium<small>3 × 3 · 9 pieces</small></button><button class="level" data-level="hard">🦄 Hard<small>4 × 4 · 16 pieces</small></button></div></div>
 <div class="section"><h2 class="section-label">2. Choose your picture</h2><div id="pictures" class="pictures"></div></div>
 <button id="startBtn" class="start">▶ Start puzzle!</button><p class="note">Little hands, big adventures 💛</p>
</section>
<section id="game" class="screen game" aria-label="Jigsaw game">
 <header class="gamehead"><button class="control home" id="homeBtn">← Setup</button><div class="gtitle" id="gameTitle">🦕 Dino Picnic</div><div class="timer" id="timer">00:00</div></header>
 <div class="board-wrap"><img id="preview" class="preview" alt="See original picture" title="Tap to enlarge"><div id="board" class="board" aria-label="Puzzle board"></div></div>
 <section class="tray-area"><div class="tray-label"><span>🧩 Pieces</span><span id="pieceCount">Tap a piece, then its spot</span></div><div id="tray" class="tray"></div></section>
 <div class="bottom-controls"><button class="control pause" id="pauseBtn">⏸ Pause</button><button class="control hint" id="hintBtn">💡 Hint</button><button class="control" id="restartBtn">🔄 Restart</button><button class="control" id="pictureBtn">🖼️ Picture</button><button class="control magic" id="magicBtn">🪄 Magic</button></div>
 <div class="status" id="status" aria-live="polite">Tap a piece, then tap where it belongs!</div>
</section>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Original picture"><div class="modalbox"><h2 id="modalTitle">Your picture!</h2><img id="modalImg" alt="Full original puzzle picture"><button id="closeModal">Back to puzzle ✨</button></div></div><div class="magic-flash" id="magicFlash"><div class="wand">🪄✨</div></div>
<script>
const scenes=[
 {name:'Dino Picnic',emoji:'🦕',bg:'#c8f2cf',svg:`<rect width="400" height="400" fill="#b9edff"/><circle cx="325" cy="72" r="38" fill="#ffdb62"/><path d="M0 260 Q90 210 180 265 T400 250 V400 H0Z" fill="#8cdda3"/><path d="M0 320 Q110 285 220 330 T400 315 V400 H0Z" fill="#64c985"/><g fill="#fff"><ellipse cx="72" cy="75" rx="32" ry="12"/><ellipse cx="96" cy="70" rx="25" ry="15"/><ellipse cx="260" cy="125" rx="27" ry="10"/></g><g transform="translate(48 120)"><path d="M55 160 Q15 155 20 110 Q25 65 82 70 L130 93 Q155 70 178 82 L165 112 Q155 138 124 132 L103 165Z" fill="#42bb8a" stroke="#248965" stroke-width="5"/><path d="M72 75 Q65 35 90 23 L107 57 L125 28 L139 72" fill="#55d6a0" stroke="#248965" stroke-width="5"/><circle cx="151" cy="95" r="6" fill="#23324d"/><path d="M164 112 Q151 121 139 112" fill="none" stroke="#23324d" stroke-width="4" stroke-linecap="round"/><path d="M57 150 L49 184 L70 184 L83 158 M117 145 L124 180 L145 180 L142 133" fill="#42bb8a" stroke="#248965" stroke-width="5"/><path d="M20 110 Q-10 105 0 80" fill="none" stroke="#248965" stroke-width="9" stroke-linecap="round"/></g><g transform="translate(240 255)"><ellipse cx="0" cy="0" rx="50" ry="18" fill="#ff7ca8"/><path d="M-40 0 L-25 35 M0 3 L5 35 M30 0 L35 30" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="-20" cy="-2" r="5" fill="#fff"/><circle cx="12" cy="-2" r="5" fill="#fff"/></g><g fill="#ff7ca8"><path d="M30 220 l7 14 15 2 -11 10 3 15 -14 -8 -13 8 3 -15 -11 -10 15 -2Z"/><path d="M340 190 l5 10 11 2 -8 8 2 11 -10 -6 -10 6 2 -11 -8 -8 11 -2Z"/></g>`},
 {name:'Space Friends',emoji:'🚀',bg:'#dcd5ff',svg:`<rect width="400" height="400" fill="#252d68"/><circle cx="65" cy="65" r="30" fill="#ffd86a"/><circle cx="75" cy="55" r="30" fill="#252d68"/><g fill="#fff"><circle cx="120" cy="55" r="3"/><circle cx="190" cy="40" r="5"/><circle cx="330" cy="80" r="4"/><circle cx="280" cy="145" r="3"/><circle cx="55" cy="180" r="4"/><circle cx="355" cy="235" r="5"/><circle cx="145" cy="300" r="4"/></g><path d="M0 340 Q80 300 160 340 T320 330 T400 345 V400 H0Z" fill="#5356a8"/><g transform="translate(105 75) rotate(-12 90 130)"><path d="M90 0 Q150 55 148 155 L90 210 L32 155 Q30 55 90 0Z" fill="#fff" stroke="#9ba8ff" stroke-width="6"/><path d="M36 145 L0 180 L40 190 M144 145 L180 180 L140 190" fill="#ff7ca8" stroke="#e35b91" stroke-width="5"/><circle cx="90" cy="95" r="27" fill="#70d7f4" stroke="#6a8bd9" stroke-width="6"/><path d="M70 207 L90 255 L110 207Z" fill="#ffb84d"/><path d="M80 207 L90 235 L100 207Z" fill="#ffef9b"/><path d="M55 30 Q90 10 125 30" fill="none" stroke="#ff7ca8" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(270 205)"><circle cx="0" cy="0" r="33" fill="#a6e6c7"/><circle cx="-11" cy="-4" r="4" fill="#25304b"/><circle cx="11" cy="-4" r="4" fill="#25304b"/><path d="M-10 11 Q0 21 10 11" fill="none" stroke="#25304b" stroke-width="4" stroke-linecap="round"/><path d="M-28 -20 L-42 -39 L-12 -31 M28 -20 L42 -39 L12 -31" fill="#ffb3d1" stroke="#a6e6c7" stroke-width="4"/></g>`},
 {name:'Ocean Pals',emoji:'🐠',bg:'#bcefff',svg:`<rect width="400" height="400" fill="#6fd3f2"/><path d="M0 60 Q100 20 200 60 T400 55 V0 H0Z" fill="#baf4ff"/><path d="M0 320 Q70 280 140 320 T280 320 T400 305 V400 H0Z" fill="#f9dc9b"/><g fill="#fff" opacity=".65"><circle cx="60" cy="140" r="8"/><circle cx="82" cy="115" r="5"/><circle cx="335" cy="150" r="9"/><circle cx="315" cy="120" r="5"/><circle cx="230" cy="75" r="7"/></g><g transform="translate(55 135)"><path d="M0 45 Q55 -10 115 45 Q55 100 0 45Z" fill="#ffb84d" stroke="#f18a43" stroke-width="5"/><path d="M112 45 L153 12 L151 78Z" fill="#ff7ca8" stroke="#e95b92" stroke-width="5"/><circle cx="29" cy="38" r="7" fill="#25304b"/><path d="M47 53 Q58 63 68 53" fill="none" stroke="#25304b" stroke-width="4" stroke-linecap="round"/><path d="M55 8 L55 80 M82 15 L82 73" stroke="#fff4cf" stroke-width="8"/></g><g transform="translate(220 215)"><path d="M0 35 Q40 -10 85 35 Q40 80 0 35Z" fill="#b18cff" stroke="#7d62d2" stroke-width="5"/><path d="M83 35 L115 9 L115 61Z" fill="#7be0bd" stroke="#58bd9d" stroke-width="4"/><circle cx="22" cy="28" r="5" fill="#25304b"/><path d="M34 43 Q43 52 51 43" fill="none" stroke="#25304b" stroke-width="3" stroke-linecap="round"/></g><g fill="#ff7ca8"><path d="M35 275 q-18 -20 -25 0 q10 20 25 0 q18 20 25 0 q-8 -20 -25 0Z"/><path d="M335 265 q-18 -20 -25 0 q10 20 25 0 q18 20 25 0 q-8 -20 -25 0Z"/></g><g fill="#ffd45c"><path d="M185 95 l7 14 15 2 -11 10 3 15 -14 -8 -13 8 3 -15 -11 -10 15 -2Z"/><path d="M330 80 l5 10 11 2 -8 8 2 11 -10 -6 -10 6 2 -11 -8 -8 11 -2Z"/></g>`}
];;
const $=id=>document.getElementById(id);const sizes={easy:2,medium:3,hard:4};let level='easy',sceneIndex=0,seconds=0,interval=null,paused=false,started=false,selected=null,placed=new Set(),sound=true,won=false;
function svgUrl(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">${s.svg}</svg>`)}function vibrate(p=20){if(navigator.vibrate)navigator.vibrate(p)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function beep(freq,dur){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start();o.stop(c.currentTime+dur)}catch(e){}}
function showSetup(){clearInterval(interval);$('game').classList.remove('active');$('setup').classList.add('active')}
function drawPictures(){ $('pictures').innerHTML='';scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='picture'+(i===sceneIndex?' active':'');b.innerHTML=`<img alt="${s.name}" src="${svgUrl(s)}"><span>${s.emoji} ${s.name}</span>`;b.onclick=()=>{sceneIndex=i;drawPictures()};$('pictures').append(b)})}
function startGame(){ $('setup').classList.remove('active');$('game').classList.add('active');buildPuzzle() }
function tickStart(){clearInterval(interval);interval=setInterval(()=>{if(!paused&&!won&&started){seconds++;$('timer').textContent=fmt(seconds)}},1000)}
function buildPuzzle(){const n=sizes[level],total=n*n,s=scenes[sceneIndex],src=svgUrl(s);placed=new Set();selected=null;won=false;paused=false;started=false;seconds=0;$('timer').textContent='00:00';$('pauseBtn').textContent='⏸ Pause';$('status').textContent='Tap a piece, then tap where it belongs!';$('gameTitle').textContent=s.emoji+' '+s.name;$('preview').src=src;$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').style.gridTemplateRows=`repeat(${n},1fr)`;$('board').innerHTML='';$('tray').innerHTML='';for(let i=0;i<total;i++){const c=document.createElement('div');c.className='cell';c.dataset.slot=i;$('board').append(c);c.addEventListener('click',()=>{if(selected!==null)tryPlace(selected,c)})}
 const order=Array.from({length:total},(_,i)=>i).sort(()=>Math.random()-.5);order.forEach(i=>{const p=document.createElement('div');p.className='piece';p.dataset.piece=i;p.setAttribute('aria-label',`Piece ${i+1}`);const x=i%n,y=Math.floor(i/n);p.style.backgroundImage=`url("${src}")`;p.style.backgroundSize=`${n*100}% ${n*100}%`;p.style.backgroundPosition=`${n===1?0:x/(n-1)*100}% ${n===1?0:y/(n-1)*100}%`;p.style.clipPath=`inset(0 round 5px)`;p.addEventListener('click',()=>{if(paused||won)return;started=true;selected=i;document.querySelectorAll('.piece.selected').forEach(e=>e.classList.remove('selected'));p.classList.add('selected');$('status').textContent=`Piece ${i+1} selected — tap its matching square`;vibrate(8)});p.addEventListener('pointerdown',e=>{if(paused||won)return; p.setPointerCapture?.(e.pointerId)});p.addEventListener('pointerup',e=>{if(paused||won)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(el){started=true;tryPlace(i,el)}});$('tray').append(p)});$('pieceCount').textContent=`0 / ${total} placed`;tickStart()}
function tryPlace(id,cell){if(paused||won)return;const slot=Number(cell.dataset.slot);if(placed.has(slot))return;if(id!==slot){$('status').textContent='Almost! Try another square 😊';vibrate(8);if(sound)beep(180,.07);return}const p=document.querySelector(`.piece[data-piece="${id}"]`);if(!p)return;started=true;cell.classList.add('filled');p.classList.remove('selected');p.classList.add('placed');p.style.width='100%';p.style.height='100%';p.style.pointerEvents='none';p.style.boxShadow='none';cell.append(p);placed.add(slot);selected=null;$('pieceCount').textContent=`${placed.size} / ${sizes[level]**2} placed`;vibrate([18,20,28]);if(sound)beep(620,.07);$('status').textContent=['Great fit! 🌟','Snap-tastic! 🧲','You got it! 🥳'][Math.floor(Math.random()*3)];if(placed.size===sizes[level]**2)finish()}
function finish(){won=true;clearInterval(interval);$('status').textContent='🎉 You solved it in '+fmt(seconds)+'!';vibrate([40,25,40,25,90]);if(sound){beep(523,.12);setTimeout(()=>beep(659,.12),130);setTimeout(()=>beep(784,.2),260)}}
function showPicture(){$('modalTitle').textContent=scenes[sceneIndex].emoji+' '+scenes[sceneIndex].name;$('modalImg').src=svgUrl(scenes[sceneIndex]);$('modal').classList.add('open')}
$('startBtn').onclick=startGame;$('homeBtn').onclick=showSetup;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b))});$('preview').onclick=showPicture;$('pictureBtn').onclick=showPicture;$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('pauseBtn').onclick=()=>{if(won)return;paused=!paused;$('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause';$('board').style.opacity=paused?'.55':'1';$('tray').style.opacity=paused?'.55':'1';$('status').textContent=paused?'Time for a little rest 💤':'Ready, set, puzzle!';vibrate(10)};$('restartBtn').onclick=buildPuzzle;$('hintBtn').onclick=()=>{if(won)return;const next=Array.from({length:sizes[level]**2},(_,i)=>i).find(i=>!placed.has(i));if(next===undefined)return;const c=document.querySelector(`.cell[data-slot="${next}"]`);c.style.backgroundImage=`url("${svgUrl(scenes[sceneIndex])}")`;c.style.backgroundSize=`${sizes[level]*100}% ${sizes[level]*100}%`;c.style.backgroundPosition=`${(next%sizes[level])/(sizes[level]-1)*100}% ${Math.floor(next/sizes[level])/(sizes[level]-1)*100}%`;setTimeout(()=>{if(!placed.has(next))c.style.backgroundImage=''},1000);$('status').textContent='A little peek at the right spot! 💡';vibrate(15)};$('magicBtn').onclick=()=>{if(won)return;$('magicFlash').classList.remove('show');void $('magicFlash').offsetWidth;$('magicFlash').classList.add('show');vibrate([25,30,25]);started=true;setTimeout(()=>{document.querySelectorAll('.cell').forEach((c,i)=>{if(placed.has(i))return;const p=document.querySelector(`.piece[data-piece="${i}"]`);if(p){c.classList.add('filled');p.classList.remove('selected','placed');p.style.pointerEvents='none';p.style.boxShadow='none';c.append(p);placed.add(i)}});$('pieceCount').textContent=`${placed.size} / ${sizes[level]**2} placed`;finish()},450);setTimeout(()=>$('magicFlash').classList.remove('show'),1000)};drawPictures();
</script></body></html>
